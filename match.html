<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تفاصيل المباراة | دوري الجزائري الابن الزيدوني</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#090d18;
    color:#f8fafc;
}
button{font-family:inherit}
a{text-decoration:none;color:inherit}

.container{
    width:min(1100px,94%);
    margin:0 auto;
    padding:18px 0 50px;
}

/* HEADER */
.match-header{
    background:linear-gradient(135deg,#111827,#0b1220);
    border-bottom:1px solid #20283b;
    padding:22px 0 0;
}
.competition{
    width:max-content;
    max-width:90%;
    margin:0 auto 20px;
    padding:10px 22px;
    border-radius:25px;
    background:#14213d;
    color:#fff;
    font-weight:bold;
    font-size:17px;
}
.teams-head{
    display:grid;
    grid-template-columns:1fr 170px 1fr;
    align-items:center;
    gap:18px;
    text-align:center;
}
.team-head{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
}
.team-head img{
    width:90px;
    height:90px;
    object-fit:contain;
}
.team-name{
    font-size:22px;
    font-weight:800;
}
.center-info{
    text-align:center;
}
.match-time{
    font-size:30px;
    font-weight:900;
}
.match-status{
    display:inline-block;
    margin-top:8px;
    padding:8px 18px;
    border-radius:25px;
    background:#16233f;
    color:#e5e7eb;
    font-weight:bold;
}
.score{
    font-size:34px;
    font-weight:900;
}
.match-date{
    margin-top:7px;
    color:#9ca3af;
    font-size:14px;
}

/* TABS */
.tabs{
    display:flex;
    justify-content:center;
    gap:4px;
    margin-top:28px;
    overflow-x:auto;
}
.tab{
    border:0;
    background:transparent;
    color:#9ca3af;
    padding:14px 22px;
    cursor:pointer;
    font-size:17px;
    border-bottom:3px solid transparent;
    white-space:nowrap;
}
.tab.active{
    color:#2dd4bf;
    border-bottom-color:#2dd4bf;
}

/* CARDS */
.card{
    background:#121827;
    border:1px solid #1d2638;
    border-radius:18px;
    padding:18px;
    margin-top:18px;
}
.card-title{
    margin:0 0 16px;
    color:#e5e7eb;
}
.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}
.info{
    background:#171d2c;
    border-radius:14px;
    padding:17px;
    display:flex;
    justify-content:space-between;
    gap:12px;
}
.info span:first-child{color:#9ca3af}
.info strong{color:#f8fafc;text-align:left}

.hidden{display:none}
.loading,.error{
    text-align:center;
    padding:30px;
    color:#9ca3af;
}
.error{color:#fca5a5}

/* PITCH */
.pitch-wrap{
    margin-top:18px;
}
.pitch-title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}
.pitch-help{
    text-align:center;
    color:#9ca3af;
    font-size:13px;
    margin-bottom:14px;
}
.pitch{
    position:relative;
    width:100%;
    max-width:850px;
    aspect-ratio:1.5 / 1;
    margin:20px auto;
    background:
        repeating-linear-gradient(
            90deg,
            #16803a 0px,
            #16803a 55px,
            #1b8f43 55px,
            #1b8f43 110px
        );
    border:4px solid white;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.pitch::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    background:white;
    transform:translateX(-50%);
    opacity:.95;
}
.pitch-center-circle{
    position:absolute;
    left:50%;
    top:50%;
    width:22%;
    aspect-ratio:1;
    border:2px solid white;
    border-radius:50%;
    transform:translate(-50%,-50%);
}
.pitch-center-dot{
    position:absolute;
    left:50%;
    top:50%;
    width:6px;
    height:6px;
    border-radius:50%;
    background:white;
    transform:translate(-50%,-50%);
}
.pitch-penalty{
    position:absolute;
    top:50%;
    width:18%;
    height:48%;
    border:2px solid white;
    transform:translateY(-50%);
}
.pitch-penalty.left{left:-2px}
.pitch-penalty.right{right:-2px}

.pitch-goal-area{
    position:absolute;
    top:50%;
    width:9%;
    height:23%;
    border:2px solid white;
    transform:translateY(-50%);
}
.pitch-goal-area.left{left:-2px}
.pitch-goal-area.right{right:-2px}

.pitch-goal{
    position:absolute;
    top:50%;
    width:2%;
    height:10%;
    border:3px solid white;
    transform:translateY(-50%);
}
.pitch-goal.left{left:-1px}
.pitch-goal.right{right:-1px}

.pitch-player{
    position:absolute;
    width:82px;
    text-align:center;
    transform:translate(-50%,-50%);
    z-index:10;
}
.pitch-player img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid white;
    background:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
}
.pitch-player-name{
    background:rgba(0,0,0,.82);
    color:white;
    border-radius:6px;
    padding:3px 5px;
    margin-top:3px;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.pitch-player-number{
    position:absolute;
    top:-4px;
    right:5px;
    background:#111827;
    color:white;
    border-radius:50%;
    width:22px;
    height:22px;
    line-height:22px;
    font-size:11px;
    font-weight:bold;
}
.pitch-player-position{
    font-size:10px;
    color:white;
    margin-top:2px;
}

/* TEAM LEGEND */
.legend{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    color:#cbd5e1;
    margin-top:12px;
}
.legend span{display:flex;align-items:center;gap:7px}
.dot{
    width:10px;height:10px;border-radius:50%;display:inline-block
}

/* EMPTY */
.empty{
    text-align:center;
    padding:35px 15px;
    color:#9ca3af;
}

@media(max-width:700px){
    .container{width:96%;padding-top:12px}
    .teams-head{
        grid-template-columns:1fr 110px 1fr;
        gap:5px;
    }
    .team-head img{width:65px;height:65px}
    .team-name{font-size:16px}
    .match-time{font-size:23px}
    .score{font-size:27px}
    .competition{font-size:14px;padding:9px 16px}
    .tab{padding:12px 14px;font-size:14px}
    .info-grid{grid-template-columns:1fr}
    .info{font-size:14px}
    .pitch-player{width:62px}
    .pitch-player img{width:43px;height:43px}
    .pitch-player-name{font-size:9px}
    .pitch-player-position{font-size:8px}
    .pitch-player-number{width:18px;height:18px;line-height:18px;font-size:9px}
}
</style>
</head>

<body>

<header class="match-header">
    <div class="container" style="padding-bottom:0">

        <div class="competition">
            🏆 الدوري الجزائري الابن الزيدوني
        </div>

        <div id="teamsHead" class="teams-head">
            <div class="team-head">
                <img id="homeLogo" src="" alt="">
                <div id="homeName" class="team-name">...</div>
            </div>

            <div class="center-info">
                <div id="scoreOrTime" class="match-time">...</div>
                <div id="status" class="match-status">جاري التحميل...</div>
                <div id="matchDate" class="match-date"></div>
            </div>

            <div class="team-head">
                <img id="awayLogo" src="" alt="">
                <div id="awayName" class="team-name">...</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="details">التفاصيل</button>
            <button class="tab" data-tab="expected">التشكيلة المتوقعة</button>
            <button class="tab" data-tab="actual">التشكيلة الفعلية</button>
        </div>
    </div>
</header>

<main class="container">

    <section id="details" class="tab-content">
        <div class="card">
            <h2 class="card-title">معلومات اللقاء</h2>
            <div class="info-grid">
                <div class="info"><span>البطولة</span><strong>الدوري الجزائري الابن الزيدوني</strong></div>
                <div class="info"><span>الجولة</span><strong id="round">-</strong></div>
                <div class="info"><span>ملعب المباراة</span><strong id="stadium">-</strong></div>
                <div class="info"><span>القناة الناقلة</span><strong id="channel">-</strong></div>
                <div class="info"><span>الحكم</span><strong id="referee">-</strong></div>
                <div class="info"><span>وقت المباراة</span><strong id="timeInfo">-</strong></div>
                <div class="info"><span>تاريخ المباراة</span><strong id="dateInfo">-</strong></div>
                <div class="info"><span>الحالة</span><strong id="playedInfo">-</strong></div>
            </div>
        </div>
    </section>

    <section id="expected" class="tab-content hidden">
        <div class="card">
            <h2 class="card-title">🎯 التشكيلة المتوقعة</h2>
            <div id="expectedBox" class="loading">جاري تحميل التشكيلة...</div>
        </div>
    </section>

    <section id="actual" class="tab-content hidden">
        <div class="card">
            <h2 class="card-title">⚽ تشكيلة المباراة الفعلية</h2>
            <div id="actualBox" class="loading">جاري تحميل التشكيلة...</div>
        </div>
    </section>

</main>

<script>
const SUPABASE_URL = "https://dtxexuaverridpntgwkj.supabase.co";
const SUPABASE_KEY = "sb_publishable_7lxTHAsOFz2L2jsq6pb4Mw_9a2xutP3";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(location.search);
const matchId = Number(params.get("id"));

let match = null;
let players = [];
let teams = [];

const FALLBACK_LOGO = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="20" fill="#1f2937"/><text x="50" y="58" text-anchor="middle" font-size="42">⚽</text></svg>'
);

function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function getTeamName(team){
    if(!team) return "";
    if(typeof team === "string") return team;
    return team.name || team.team_name || "";
}

function getTeamLogo(team){
    if(!team) return FALLBACK_LOGO;
    return team.logo || team.logo_url || team.image || team.photo || FALLBACK_LOGO;
}

function getPlayer(id){
    return players.find(p => String(p.id) === String(id));
}

function formatDate(date){
    if(!date) return "-";
    const s = String(date);
    const parts = s.slice(0,10).split("-");
    if(parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
    return s;
}

function formatTime(time){
    if(!time) return "-";
    return String(time).slice(0,5);
}

function normalizePlayed(value){
    return value === true || value === "true" || value === 1 || value === "1";
}

function positionIcon(position){
    return {
        GK:"🧤",
        DEF:"🛡️",
        MID:"⚙️",
        ATT:"⚡"
    }[position] || "";
}

async function loadMatch(){
    if(!matchId){
        document.body.innerHTML = '<div class="loading">معرّف المباراة غير موجود.</div>';
        return;
    }

    const {data, error} = await supabaseClient
        .from("matches")
        .select("*")
        .eq("id", matchId)
        .single();

    if(error || !data){
        console.error("match:", error);
        document.body.innerHTML = '<div class="error">تعذر تحميل المباراة.</div>';
        return;
    }

    match = data;

    const [
        playersResult,
        teamsResult
    ] = await Promise.all([
        supabaseClient.from("players").select("*"),
        supabaseClient.from("teams").select("*")
    ]);

    players = playersResult.data || [];
    teams = teamsResult.data || [];

    renderHeader();
    renderDetails();
    await loadExpected();
    await loadActual();
}

function findTeam(name){
    return teams.find(t =>
        String(t.name || t.team_name || "").trim() === String(name || "").trim()
    );
}

function renderHeader(){
    const homeTeam = findTeam(match.home);
    const awayTeam = findTeam(match.away);

    document.getElementById("homeName").textContent = match.home || "-";
    document.getElementById("awayName").textContent = match.away || "-";

    const homeLogo = document.getElementById("homeLogo");
    const awayLogo = document.getElementById("awayLogo");

    homeLogo.src = getTeamLogo(homeTeam);
    awayLogo.src = getTeamLogo(awayTeam);
    homeLogo.onerror = () => homeLogo.src = FALLBACK_LOGO;
    awayLogo.onerror = () => awayLogo.src = FALLBACK_LOGO;

    const played = normalizePlayed(match.played);

    if(played){
        document.getElementById("scoreOrTime").textContent =
            `${Number(match.home_goals ?? 0)} - ${Number(match.away_goals ?? 0)}`;
        document.getElementById("status").textContent = "انتهت";
    }else{
        document.getElementById("scoreOrTime").textContent =
            formatTime(match.time);
        document.getElementById("status").textContent = "لم تبدأ";
    }

    document.getElementById("matchDate").textContent = formatDate(match.date);
}

function renderDetails(){
    document.getElementById("round").textContent = match.round || "-";
    document.getElementById("stadium").textContent =
        match.stadium || match.venue || "-";
    document.getElementById("channel").textContent =
        match.channel || match.broadcast || "-";
    document.getElementById("referee").textContent =
        match.referee || match.official || "-";
    document.getElementById("timeInfo").textContent = formatTime(match.time);
    document.getElementById("dateInfo").textContent = formatDate(match.date);
    document.getElementById("playedInfo").textContent =
        normalizePlayed(match.played) ? "انتهت المباراة" : "لم تبدأ بعد";
}

function buildPitch(rows){
    if(!rows || !rows.length){
        return '<div class="empty">لا توجد تشكيلة محفوظة لهذه المباراة.</div>';
    }

    const html = rows
        .map(row => {
            const p = getPlayer(row.player_id);
            if(!p) return "";

            let x = Number(row.x);
            let y = Number(row.y);

            if(!Number.isFinite(x) || x < 1 || x > 99) x = 50;
            if(!Number.isFinite(y) || y < 1 || y > 99) y = 50;

            const photo = p.photo || p.photo_url || FALLBACK_LOGO;
            const position = row.position || "";

            return `
                <div class="pitch-player"
                     style="left:${x}%;top:${y}%">
                    <div class="pitch-player-number">${escapeHTML(p.number ?? "")}</div>
                    <img src="${escapeHTML(photo)}" alt="">
                    <div class="pitch-player-name">${escapeHTML(p.name || "لاعب")}</div>
                    <div class="pitch-player-position">
                        ${escapeHTML(position)} ${positionIcon(position)}
                    </div>
                </div>
            `;
        }).join("");

    return `
        <div class="pitch-wrap">
            <div class="pitch-title">🟢 ملعب المباراة</div>
            <div class="pitch-help">نفس أماكن اللاعبين المحفوظة من لوحة الإدارة</div>

            <div class="pitch">
                <div class="pitch-center-circle"></div>
                <div class="pitch-center-dot"></div>

                <div class="pitch-penalty left"></div>
                <div class="pitch-penalty right"></div>

                <div class="pitch-goal-area left"></div>
                <div class="pitch-goal-area right"></div>

                <div class="pitch-goal left"></div>
                <div class="pitch-goal right"></div>

                ${html}
            </div>

            <div class="legend">
                <span><i class="dot" style="background:#facc15"></i>${escapeHTML(match.home || "")}</span>
                <span><i class="dot" style="background:#ef4444"></i>${escapeHTML(match.away || "")}</span>
            </div>
        </div>
    `;
}

async function loadExpected(){
    const box = document.getElementById("expectedBox");

    const {data, error} = await supabaseClient
        .from("expected_lineups")
        .select("*")
        .eq("match_id", matchId);

    if(error){
        console.error("expected_lineups:", error);
        box.innerHTML = `
            <div class="error">
                تعذر تحميل التشكيلة المتوقعة.<br>
                ${escapeHTML(error.message)}
            </div>`;
        return;
    }

    const rows = data || [];

    if(!rows.length){
        box.innerHTML = '<div class="empty">لم يتم حفظ التشكيلة المتوقعة بعد.</div>';
        return;
    }

    box.innerHTML = buildPitch(rows);
}

async function loadActual(){
    const box = document.getElementById("actualBox");

    const {data, error} = await supabaseClient
        .from("match_players")
        .select("*")
        .eq("match_id", matchId);

    if(error){
        console.error("match_players:", error);
        box.innerHTML = `
            <div class="error">
                تعذر تحميل التشكيلة الفعلية.<br>
                ${escapeHTML(error.message)}
            </div>`;
        return;
    }

    const rows = data || [];

    if(!rows.length){
        box.innerHTML = '<div class="empty">لا توجد تشكيلة فعلية محفوظة لهذه المباراة بعد.</div>';
        return;
    }

    box.innerHTML = buildPitch(rows);
}

document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(s => s.classList.add("hidden"));

        button.classList.add("active");
        document.getElementById(button.dataset.tab).classList.remove("hidden");
    });
});

loadMatch();
</script>

</body>
</html>
