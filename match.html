<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>تفاصيل المباراة | دوري الابن الزيدوني</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f1f5f9;
    color:#172033;
}

header{
    background:#111827;
    color:white;
    padding:25px 15px;
    text-align:center;
}

header h1{
    margin:0;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

/* ================= MATCH ================= */

.match-header{
    text-align:center;
}

.match-round{
    color:#64748b;
    margin-bottom:15px;
}

.teams{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
}

.team{
    min-width:180px;
    text-align:center;
}

.team-logo{
    width:100px;
    height:100px;
    object-fit:contain;
    display:block;
    margin:10px auto;
}

.team-name{
    font-size:22px;
    font-weight:bold;
}

.score{
    font-size:42px;
    font-weight:bold;
    margin:10px;
}

.vs{
    font-size:28px;
    font-weight:bold;
    color:#64748b;
}

.not-started{
    background:#eff6ff;
    color:#1d4ed8;
    padding:15px;
    border-radius:12px;
    margin-top:20px;
    font-weight:bold;
}

.match-date{
    margin-top:12px;
    color:#475569;
}

/* ================= PITCH ================= */

.pitch-title{
    text-align:center;
    margin-bottom:15px;
}

.pitch{
    position:relative;
    width:100%;
    max-width:900px;

    /*
       ملعب عمودي حقيقي:
       105 متر طول
       68 متر عرض
    */
    aspect-ratio:68 / 105;

    margin:24px auto;

    background:
        repeating-linear-gradient(
            180deg,
            #167a38 0%,
            #167a38 8.333%,
            #1b8740 8.333%,
            #1b8740 16.666%
        );

    border:3px solid #ffffff;
    border-radius:4px;
    overflow:hidden;

    box-shadow:
        0 12px 35px rgba(0,0,0,.28);
}

/* منتصف الملعب */

.pitch-midline{
    position:absolute;
    left:0;
    right:0;
    top:50%;
    height:2px;
    background:#fff;
    transform:translateY(-50%);
    z-index:2;
}

/* دائرة المنتصف */

.pitch-center-circle{
    position:absolute;

    width:26.91%;
    aspect-ratio:1;

    border:2px solid #fff;
    border-radius:50%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:2;
}

.pitch-center-dot{
    position:absolute;

    width:7px;
    height:7px;

    background:#fff;
    border-radius:50%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:3;
}

/* منطقة الجزاء */

.pitch-penalty{
    position:absolute;

    left:50%;

    width:59.26%;
    height:15.71%;

    border:2px solid #fff;

    transform:translateX(-50%);

    z-index:2;
}

.pitch-penalty.top{
    top:-2px;
}

.pitch-penalty.bottom{
    bottom:-2px;
}

/* منطقة المرمى */

.pitch-goal-area{
    position:absolute;

    left:50%;

    width:26.94%;
    height:5.24%;

    border:2px solid #fff;

    transform:translateX(-50%);

    z-index:2;
}

.pitch-goal-area.top{
    top:-2px;
}

.pitch-goal-area.bottom{
    bottom:-2px;
}

/* المرمى */

.pitch-goal{
    position:absolute;

    left:50%;

    width:10.76%;
    height:3.1%;

    border:2px solid #fff;

    transform:translateX(-50%);

    z-index:2;
}

.pitch-goal.top{
    top:0;
}

.pitch-goal.bottom{
    bottom:0;
}

/* ================= PLAYERS ================= */

.pitch-player{
    position:absolute;

    width:78px;

    text-align:center;

    transform:translate(-50%,-50%);

    z-index:10;

    pointer-events:none;
}

.pitch-player img{
    width:54px;
    height:54px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid white;

    background:white;

    box-shadow:
        0 3px 10px rgba(0,0,0,.45);
}

.pitch-player-name{
    background:rgba(0,0,0,.78);

    color:white;

    border-radius:6px;

    padding:3px 5px;

    margin-top:3px;

    font-size:12px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.pitch-player-number{
    position:absolute;

    top:-4px;
    right:6px;

    background:#111827;
    color:white;

    width:22px;
    height:22px;

    line-height:22px;

    border-radius:50%;

    font-size:11px;
    font-weight:bold;
}

.pitch-position{
    color:white;

    font-size:10px;

    margin-top:2px;

    text-shadow:
        0 1px 3px rgba(0,0,0,.8);
}

/* ================= TEAM LABEL ================= */

.lineup-team-title{
    text-align:center;

    margin:15px auto;

    padding:10px 15px;

    background:#f1f5f9;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;
}

/* ================= ERROR ================= */

.lineup-error{
    background:#fee2e2;

    color:#991b1b;

    padding:15px;

    border-radius:12px;

    text-align:center;

    margin-top:15px;
}

/* ================= PLAYER STATS ================= */

.players-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;
}

.player-card{
    background:#f8fafc;

    border-radius:15px;

    padding:15px;

    display:flex;

    align-items:center;

    gap:12px;
}

.player-card img{
    width:60px;
    height:60px;

    object-fit:cover;

    border-radius:50%;
}

.player-info{
    flex:1;
}

.player-name{
    font-weight:bold;
}

.player-stat{
    font-size:13px;

    color:#64748b;

    margin-top:3px;
}

.badges{
    margin-top:5px;
}

.goal-badge{
    color:#15803d;
}

.assist-badge{
    color:#2563eb;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .teams{
        gap:10px;
    }

    .team{
        min-width:120px;
    }

    .team-logo{
        width:75px;
        height:75px;
    }

    .team-name{
        font-size:17px;
    }

    .score{
        font-size:30px;
    }

    .players-grid{
        grid-template-columns:1fr;
    }

    .pitch{
        width:100%;
        max-width:500px;
    }

    .pitch-player{
        width:60px;
    }

    .pitch-player img{
        width:42px;
        height:42px;
    }

    .pitch-player-name{
        font-size:10px;
    }

    .pitch-center-circle{
        width:26.91%;
    }

}

</style>

</head>

<body>

<header>

    <h1>
        ⚽ دوري الابن الزيدوني
    </h1>

</header>


<div class="container">


<!-- ================= MATCH INFO ================= -->

<div
    id="matchInfo"
    class="card"
>

    جاري تحميل المباراة...

</div>


<!-- ================= EXPECTED LINEUP ================= -->

<div
    id="expectedSection"
    class="card"
    style="display:none;"
>

    <h2 class="pitch-title">
        🎯 الخطة والتشكيلة المتوقعة
    </h2>

    <div
        id="expectedTeamTitle"
        class="lineup-team-title"
    ></div>

    <div
        id="expectedPitch"
        class="pitch"
    >

        <div class="pitch-midline"></div>

        <div class="pitch-center-circle"></div>

        <div class="pitch-center-dot"></div>

        <div class="pitch-penalty top"></div>

        <div class="pitch-penalty bottom"></div>

        <div class="pitch-goal-area top"></div>

        <div class="pitch-goal-area bottom"></div>

        <div class="pitch-goal top"></div>

        <div class="pitch-goal bottom"></div>

        <div id="expectedPlayers"></div>

    </div>

</div>


<!-- ================= ACTUAL LINEUP ================= -->

<div
    id="actualSection"
    class="card"
    style="display:none;"
>

    <h2 class="pitch-title">
        ⚽ تشكيلة المباراة
    </h2>

    <div
        id="actualTeamTitle"
        class="lineup-team-title"
    ></div>

    <div
        id="actualPitch"
        class="pitch"
    >

        <div class="pitch-midline"></div>

        <div class="pitch-center-circle"></div>

        <div class="pitch-center-dot"></div>

        <div class="pitch-penalty top"></div>

        <div class="pitch-penalty bottom"></div>

        <div class="pitch-goal-area top"></div>

        <div class="pitch-goal-area bottom"></div>

        <div class="pitch-goal top"></div>

        <div class="pitch-goal bottom"></div>

        <div id="actualPlayers"></div>

    </div>

</div>


<!-- ================= PLAYER RATINGS ================= -->

<div
    id="ratingsSection"
    class="card"
    style="display:none;"
>

    <h2>
        ⭐ تقييمات اللاعبين
    </h2>

    <div
        id="ratings"
        class="players-grid"
    ></div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://dtxexuaverridpntgwkj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7lxTHAsOFz2Ljsq6pb4Mw_9a2xutP3";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GET MATCH ID
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);

const matchId =
params.get("id");


/* =====================================================
   LOAD MATCH
===================================================== */

async function loadMatch(){

    if(!matchId){

        document.getElementById(
            "matchInfo"
        ).innerHTML = `

            <h2>
                ❌ لم يتم تحديد المباراة
            </h2>

        `;

        return;
    }


    try{

        const {data:match,error} =
            await supabaseClient
            .from("matches")
            .select("*")
            .eq("id",matchId)
            .single();


        if(error)
            throw error;


        if(!match){

            throw new Error(
                "المباراة غير موجودة"
            );

        }


        await renderMatch(match);

    }

    catch(error){

        console.error(
            "LOAD MATCH ERROR:",
            error
        );

        document.getElementById(
            "matchInfo"
        ).innerHTML = `

            <div class="lineup-error">

                ❌ حدث خطأ أثناء تحميل المباراة

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


/* =====================================================
   RENDER MATCH
===================================================== */

async function renderMatch(match){

    const {data:teams,error:teamsError} =
        await supabaseClient
        .from("teams")
        .select("*");


    if(teamsError){

        console.error(
            "TEAMS ERROR:",
            teamsError
        );

    }


    const homeTeam =
        teams?.find(
            team =>
            String(team.name) ===
            String(match.home)
        );


    const awayTeam =
        teams?.find(
            team =>
            String(team.name) ===
            String(match.away)
        );


    const homeLogo =
        homeTeam?.logo ||
        "https://via.placeholder.com/100?text=HOME";


    const awayLogo =
        awayTeam?.logo ||
        "https://via.placeholder.com/100?text=AWAY";


    const future =
        match.played !== true;


    document.getElementById(
        "matchInfo"
    ).innerHTML = `

        <div class="match-header">

            ${
                match.round
                ? `

                    <div class="match-round">

                        ${escapeHtml(
                            match.round
                        )}

                    </div>

                  `
                : ""
            }


            <div class="teams">

                <div class="team">

                    <img
                        class="team-logo"
                        src="${homeLogo}"
                    >

                    <div class="team-name">

                        ${escapeHtml(
                            match.home
                        )}

                    </div>

                </div>


                <div>

                    ${
                        future

                        ? `

                            <div class="vs">
                                VS
                            </div>

                          `

                        : `

                            <div class="score">

                                ${Number(
                                    match.home_goals
                                ) || 0}

                                -

                                ${Number(
                                    match.away_goals
                                ) || 0}

                            </div>

                          `
                    }

                </div>


                <div class="team">

                    <img
                        class="team-logo"
                        src="${awayLogo}"
                    >

                    <div class="team-name">

                        ${escapeHtml(
                            match.away
                        )}

                    </div>

                </div>

            </div>


            ${
                future

                ? `

                    <div class="not-started">

                        ⏳ لم تبدأ المباراة بعد

                    </div>

                  `

                : ""

            }


            ${
                match.match_date ||
                match.match_time

                ? `

                    <div class="match-date">

                        ${
                            match.match_date

                            ? "📅 " +
                              formatDate(
                                  match.match_date
                              )

                            : ""
                        }

                        ${
                            match.match_time

                            ? " &nbsp; 🕐 " +
                              String(
                                  match.match_time
                              ).slice(0,5)

                            : ""
                        }

                    </div>

                  `

                : ""

            }

        </div>

    `;


    /*
       مهم جدًا:
       نحاول تحميل الخطة المتوقعة دائمًا،
       وليس فقط عندما تكون المباراة قادمة.

       هذا يسمح للخطة المحفوظة في admin
       أن تظهر في match.html أيضًا.
    */

    await loadExpectedLineup(match);


    /*
       التشكيلة الفعلية تظهر للمباريات المنتهية.
    */

    if(
        match.played === true
    ){

        await loadActualLineup(match);

    }

}


/* =====================================================
   EXPECTED LINEUP
===================================================== */

async function loadExpectedLineup(match){

    const section =
        document.getElementById(
            "expectedSection"
        );

    const container =
        document.getElementById(
            "expectedPlayers"
        );


    container.innerHTML = "";


    /*
       جلب الخطة من نفس الجدول
       الذي يحفظ فيه admin.html
    */

    const {
        data,
        error
    } =
        await supabaseClient
        .from("expected_lineups")
        .select("*")
        .eq(
            "match_id",
            match.id
        )
        .order(
            "id",
            {
                ascending:true
            }
        );


    console.log(
        "EXPECTED LINEUP:",
        data,
        error
    );


    if(error){

        console.error(
            "EXPECTED LINEUP ERROR:",
            error
        );


        section.style.display =
            "block";


        container.innerHTML = `

            <div class="lineup-error">

                ❌ تعذر تحميل الخطة

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        /*
           لا نخفي القسم بسبب عدم وجود خطة.
           فقط نعرض رسالة واضحة.
        */

        section.style.display =
            "block";


        container.innerHTML = `

            <div
                style="
                    text-align:center;
                    padding:20px;
                    color:#64748b;
                "
            >

                📋 لا توجد خطة محفوظة
                لهذه المباراة حتى الآن.

            </div>

        `;

        return;

    }


    section.style.display =
        "block";


    /*
       الحصول على جميع player_id
    */

    const playerIds =
        data
        .map(
            row =>
                row.player_id
        )
        .filter(
            id =>
                id !== null &&
                id !== undefined
        );


    if(
        playerIds.length === 0
    ){

        container.innerHTML = `

            <div class="lineup-error">

                ❌ الخطة موجودة،
                لكن لا توجد معرفات لاعبين فيها.

            </div>

        `;

        return;

    }


    /*
       جلب اللاعبين
    */

    const {
        data:players,
        error:playersError
    } =
        await supabaseClient
        .from("players")
        .select("*")
        .in(
            "id",
            playerIds
        );


    if(playersError){

        console.error(
            "EXPECTED PLAYERS ERROR:",
            playersError
        );


        container.innerHTML = `

            <div class="lineup-error">

                ❌ تعذر تحميل لاعبي الخطة

                <br><br>

                ${escapeHtml(
                    playersError.message
                )}

            </div>

        `;

        return;

    }


    if(
        !players ||
        players.length === 0
    ){

        container.innerHTML = `

            <div class="lineup-error">

                ❌ لم يتم العثور على اللاعبين
                الموجودين في الخطة.

            </div>

        `;

        return;

    }


    /*
       إظهار أسماء الفريقين إذا كانت الخطة
       تحتوي على أكثر من فريق.
    */

    const teamsInLineup =
        [
            ...new Set(
                data
                .map(
                    row =>
                        row.team
                )
                .filter(Boolean)
            )
        ];


    document.getElementById(
        "expectedTeamTitle"
    ).textContent =

        teamsInLineup.length > 0

        ? "🏟️ " +
          teamsInLineup.join("  ×  ")

        : match.home +
          "  ×  " +
          match.away;


    /*
       رسم اللاعبين في أماكنهم المحفوظة.
    */

    let html = "";


    data.forEach(row => {

        const player =
            players.find(
                p =>
                    String(p.id) ===
                    String(row.player_id)
            );


        if(!player)
            return;


        html +=
            createPitchPlayer(
                player,
                row,
                "expected"
            );

    });


    container.innerHTML =
        html;


    /*
       إذا كانت بعض الصفوف لم ترسم،
       نعرض تنبيهًا مفيدًا.
    */

    if(!html){

        container.innerHTML = `

            <div class="lineup-error">

                ❌ لم يتمكن الموقع من ربط
                لاعبي الخطة باللاعبين في قاعدة البيانات.

            </div>

        `;

    }

}


/* =====================================================
   ACTUAL LINEUP
===================================================== */

async function loadActualLineup(match){

    const section =
        document.getElementById(
            "actualSection"
        );

    const container =
        document.getElementById(
            "actualPlayers"
        );


    const {
        data,
        error
    } =
        await supabaseClient
        .from("match_players")
        .select("*")
        .eq(
            "match_id",
            match.id
        )
        .order(
            "id",
            {
                ascending:true
            }
        );


    console.log(
        "ACTUAL LINEUP:",
        data,
        error
    );


    if(error){

        console.error(
            "ACTUAL LINEUP ERROR:",
            error
        );

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        return;

    }


    section.style.display =
        "block";


    const playerIds =
        data
        .map(
            row =>
                row.player_id
        )
        .filter(
            id =>
                id !== null &&
                id !== undefined
        );


    if(
        playerIds.length === 0
    )
        return;


    const {
        data:players,
        error:playersError
    } =
        await supabaseClient
        .from("players")
        .select("*")
        .in(
            "id",
            playerIds
        );


    if(playersError){

        console.error(
            playersError
        );

        return;

    }


    if(!players)
        return;


    const teamsInLineup =
        [
            ...new Set(
                data
                .map(
                    row =>
                        row.team
                )
                .filter(Boolean)
            )
        ];


    document.getElementById(
        "actualTeamTitle"
    ).textContent =

        teamsInLineup.length > 0

        ? "🏟️ " +
          teamsInLineup.join("  ×  ")

        : match.home +
          "  ×  " +
          match.away;


    container.innerHTML =
        data
        .map(
            row => {

                const player =
                    players.find(
                        p =>
                            String(p.id) ===
                            String(row.player_id)
                    );


                if(!player)
                    return "";


                return createPitchPlayer(
                    player,
                    row,
                    "actual"
                );

            }
        )
        .join("");


    renderRatings(
        data,
        players
    );

}


/* =====================================================
   CREATE PLAYER ON PITCH
===================================================== */

function createPitchPlayer(
    player,
    row,
    type
){

    /*
       x و y هما إحداثيات اللاعب التي
       حفظها admin.html.

       إذا كانت موجودة نستخدمها كما هي.
    */

    let x =
        Number(row.x);

    let y =
        Number(row.y);


    /*
       حماية إذا كانت القيمة غير موجودة.
    */

    if(
        !Number.isFinite(x)
    )
        x = 50;


    if(
        !Number.isFinite(y)
    )
        y = 50;


    /*
       إبقاء اللاعب داخل الملعب.
    */

    x =
        Math.max(
            2,
            Math.min(
                98,
                x
            )
        );


    y =
        Math.max(
            2,
            Math.min(
                98,
                y
            )
        );


    const photo =
        player.photo ||
        "https://via.placeholder.com/55?text=PLAYER";


    const positionIcons = {

        GK:"🧤",

        DEF:"🛡️",

        MID:"⚙️",

        ATT:"⚡",

        FWD:"⚡",

        CB:"🛡️",

        LB:"🛡️",

        RB:"🛡️",

        CM:"⚙️",

        CDM:"⚙️",

        CAM:"⚙️",

        LW:"⚡",

        RW:"⚡",

        ST:"⚡"

    };


    const position =
        String(
            row.position ||
            player.position ||
            ""
        );


    const icon =
        positionIcons[position] ||
        "";


    const goalIcon =
        Number(row.goals) > 0
        ? " ⚽"
        : "";


    const assistIcon =
        Number(row.assists) > 0
        ? " 👟"
        : "";


    return `

        <div
            class="pitch-player"
            style="
                left:${x}%;
                top:${y}%;
            "
        >

            ${
                player.number !== null &&
                player.number !== undefined &&
                player.number !== ""

                ? `

                    <div
                        class="pitch-player-number"
                    >

                        ${escapeHtml(
                            player.number
                        )}

                    </div>

                  `

                : ""

            }


            <img
                src="${escapeAttribute(photo)}"
                alt="${escapeHtml(player.name)}"
            >


            <div
                class="pitch-player-name"
            >

                ${escapeHtml(
                    player.name
                )}

                ${goalIcon}
                ${assistIcon}

            </div>


            <div
                class="pitch-position"
            >

                ${icon}

                ${escapeHtml(
                    position
                )}

            </div>

        </div>

    `;

}


/* =====================================================
   RATINGS
===================================================== */

function renderRatings(
    rows,
    players
){

    const section =
        document.getElementById(
            "ratingsSection"
        );


    const container =
        document.getElementById(
            "ratings"
        );


    section.style.display =
        "block";


    container.innerHTML =
        [...rows]
        .sort(
            (a,b) =>
                Number(
                    b.rating || 0
                )
                -
                Number(
                    a.rating || 0
                )
        )
        .map(
            row => {

                const player =
                    players.find(
                        p =>
                            String(p.id) ===
                            String(row.player_id)
                    );


                if(!player)
                    return "";


                const photo =
                    player.photo ||
                    "https://via.placeholder.com/60?text=P";


                return `

                    <div
                        class="player-card"
                    >

                        <img
                            src="${escapeAttribute(photo)}"
                            alt="${escapeHtml(player.name)}"
                        >


                        <div
                            class="player-info"
                        >

                            <div
                                class="player-name"
                            >

                                ${escapeHtml(
                                    player.name
                                )}

                            </div>


                            <div
                                class="player-stat"
                            >

                                ⭐ التقييم:

                                <strong>

                                    ${Number(
                                        row.rating || 0
                                    ).toFixed(1)}

                                </strong>

                            </div>


                            <div
                                class="badges"
                            >

                                ${
                                    Number(
                                        row.goals
                                    ) > 0

                                    ? `

                                        <span
                                            class="goal-badge"
                                        >

                                            ⚽
                                            ${Number(
                                                row.goals
                                            )}
                                            هدف

                                        </span>

                                      `

                                    : ""
                                }


                                ${
                                    Number(
                                        row.assists
                                    ) > 0

                                    ? `

                                        <span
                                            class="assist-badge"
                                        >

                                            👟
                                            ${Number(
                                                row.assists
                                            )}
                                            أسيست

                                        </span>

                                      `

                                    : ""
                                }

                            </div>

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   DATE
===================================================== */

function formatDate(date){

    if(!date)
        return "";


    const parts =
        String(date).split("-");


    if(parts.length !== 3)
        return escapeHtml(date);


    return `
        ${parts[2]}/${parts[1]}/${parts[0]}
    `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}
