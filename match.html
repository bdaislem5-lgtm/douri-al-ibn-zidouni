<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تفاصيل المباراة | دوري الابن الزيدوني</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:
        linear-gradient(135deg,#eef2f7,#f8fafc);
    color:#172033;
}

header{
    background:
        linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    padding:25px 15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

header h1{
    margin:0;
    font-size:28px;
}

.container{
    max-width:1150px;
    margin:30px auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:22px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:
        0 10px 30px rgba(15,23,42,.08);
}


/* =====================================================
   MATCH HEADER
===================================================== */

.match-header{
    text-align:center;
}

.match-round{
    display:inline-block;
    background:#f1f5f9;
    color:#475569;
    padding:7px 15px;
    border-radius:20px;
    margin-bottom:20px;
    font-weight:bold;
}

.teams{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:70px;
}

.team{
    min-width:190px;
    text-align:center;
}

.team-logo{
    width:115px;
    height:115px;
    object-fit:contain;
    display:block;
    margin:10px auto;
}

.team-name{
    font-size:23px;
    font-weight:bold;
}

.score{
    font-size:46px;
    font-weight:900;
    margin:10px;
}

.vs{
    font-size:30px;
    font-weight:900;
    color:#64748b;
}

.not-started{
    background:#eff6ff;
    color:#1d4ed8;
    padding:14px;
    border-radius:13px;
    margin-top:22px;
    font-weight:bold;
}

.finished{
    background:#f0fdf4;
    color:#15803d;
    padding:14px;
    border-radius:13px;
    margin-top:22px;
    font-weight:bold;
}

.match-date{
    margin-top:15px;
    color:#475569;
    font-weight:bold;
}


/* =====================================================
   LINEUP TITLE
===================================================== */

.pitch-title{
    text-align:center;
    margin:5px 0 20px;
    font-size:25px;
}

.pitch-subtitle{
    text-align:center;
    color:#64748b;
    margin-top:-10px;
    margin-bottom:20px;
}


/* =====================================================
   FOOTBALL PITCH
===================================================== */

.pitch-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
}

.pitch{

    position:relative;

    width:100%;
    max-width:650px;

    /*
       ملعب عمودي
       مثل ملاعب خطط FIFA
    */
    aspect-ratio:0.68 / 1;

    margin:20px auto;

    background:
        repeating-linear-gradient(
            0deg,
            #087f3e 0px,
            #087f3e 65px,
            #0b8f46 65px,
            #0b8f46 130px
        );

    border:5px solid #ffffff;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 18px 45px rgba(0,0,0,.28);

}


/* خطوط خارجية */

.pitch::before{
    content:"";

    position:absolute;

    inset:0;

    border:2px solid rgba(255,255,255,.95);

    pointer-events:none;

}


/* =====================================================
   MIDLINE
===================================================== */

.pitch-midline{

    position:absolute;

    left:0;
    right:0;

    top:50%;

    height:3px;

    background:white;

    transform:translateY(-50%);

}


/* =====================================================
   CENTER CIRCLE
===================================================== */

.pitch-center-circle{

    position:absolute;

    width:145px;
    height:145px;

    border:3px solid white;

    border-radius:50%;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

}


/* CENTER DOT */

.pitch-center-dot{

    position:absolute;

    width:10px;
    height:10px;

    background:white;

    border-radius:50%;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

}


/* =====================================================
   PENALTY AREAS
===================================================== */

.pitch-penalty{

    position:absolute;

    left:50%;

    width:58%;
    height:18%;

    border:3px solid white;

    transform:
        translateX(-50%);

}


/* TOP */

.pitch-penalty.top{
    top:-3px;

    border-top:none;

    border-radius:
        0 0 5px 5px;
}


/* BOTTOM */

.pitch-penalty.bottom{
    bottom:-3px;

    border-bottom:none;

    border-radius:
        5px 5px 0 0;
}


/* =====================================================
   GOAL AREAS
===================================================== */

.pitch-goal-area{

    position:absolute;

    left:50%;

    width:32%;
    height:8%;

    border:3px solid white;

    transform:
        translateX(-50%);

}


/* TOP */

.pitch-goal-area.top{

    top:-3px;

    border-top:none;

}


/* BOTTOM */

.pitch-goal-area.bottom{

    bottom:-3px;

    border-bottom:none;

}


/* =====================================================
   GOALS
===================================================== */

.pitch-goal{

    position:absolute;

    left:50%;

    width:25%;
    height:2.5%;

    border:
        4px solid white;

    transform:
        translateX(-50%);

    background:
        rgba(255,255,255,.08);

}


/* TOP */

.pitch-goal.top{
    top:-2px;
}


/* BOTTOM */

.pitch-goal.bottom{
    bottom:-2px;
}


/* =====================================================
   PENALTY SPOTS
===================================================== */

.pitch-penalty-dot{

    position:absolute;

    left:50%;

    width:8px;
    height:8px;

    background:white;

    border-radius:50%;

    transform:
        translateX(-50%);

}


.pitch-penalty-dot.top{
    top:13%;
}


.pitch-penalty-dot.bottom{
    bottom:13%;
}


/* =====================================================
   PLAYERS
===================================================== */

.pitch-player{

    position:absolute;

    width:90px;

    text-align:center;

    transform:
        translate(-50%,-50%);

    z-index:10;

    transition:
        transform .2s ease;

}


.pitch-player:hover{

    transform:
        translate(-50%,-50%)
        scale(1.08);

    z-index:30;

}


/* PLAYER IMAGE */

.pitch-player img{

    width:62px;
    height:62px;

    object-fit:cover;

    border-radius:50%;

    border:
        3px solid white;

    background:white;

    box-shadow:
        0 5px 14px rgba(0,0,0,.45);

}


/* PLAYER NUMBER */

.pitch-player-number{

    position:absolute;

    top:-5px;
    right:7px;

    background:
        linear-gradient(135deg,#111827,#334155);

    color:white;

    width:24px;
    height:24px;

    line-height:24px;

    border-radius:50%;

    font-size:11px;

    font-weight:bold;

    border:2px solid white;

}


/* PLAYER NAME */

.pitch-player-name{

    background:
        rgba(15,23,42,.90);

    color:white;

    border-radius:7px;

    padding:4px 7px;

    margin-top:4px;

    font-size:12px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    box-shadow:
        0 3px 8px rgba(0,0,0,.25);

}


/* POSITION */

.pitch-position{

    color:white;

    font-size:10px;

    margin-top:3px;

    font-weight:bold;

    text-shadow:
        0 1px 3px black;

}


/* =====================================================
   TEAM LABELS ON PITCH
===================================================== */

.pitch-team-label{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    background:
        rgba(0,0,0,.45);

    color:white;

    padding:5px 14px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

    z-index:5;

    pointer-events:none;

}

.pitch-team-label.top{
    top:8px;
}

.pitch-team-label.bottom{
    bottom:8px;
}


/* =====================================================
   PLAYER RATINGS
===================================================== */

.players-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

}

.player-card{

    background:#f8fafc;

    border-radius:15px;

    padding:15px;

    display:flex;

    align-items:center;

    gap:12px;

    border:1px solid #e2e8f0;

}

.player-card img{

    width:60px;
    height:60px;

    object-fit:cover;

    border-radius:50%;

}

.player-info{
    flex:1;
}

.player-name{
    font-weight:bold;
}

.player-stat{
    font-size:13px;
    color:#64748b;
    margin-top:3px;
}

.badges{
    margin-top:5px;
}

.goal-badge{
    color:#15803d;
    margin-left:8px;
}

.assist-badge{
    color:#2563eb;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .container{
        padding:10px;
        margin-top:15px;
    }

    .card{
        padding:16px;
        border-radius:17px;
    }

    .teams{
        gap:8px;
    }

    .team{
        min-width:110px;
    }

    .team-logo{
        width:75px;
        height:75px;
    }

    .team-name{
        font-size:17px;
    }

    .score{
        font-size:30px;
    }

    .vs{
        font-size:22px;
    }

    .pitch{
        max-width:430px;
    }

    .pitch-player{
        width:65px;
    }

    .pitch-player img{
        width:46px;
        height:46px;
    }

    .pitch-player-name{
        font-size:9px;
        padding:3px 4px;
    }

    .pitch-player-number{
        width:20px;
        height:20px;
        line-height:20px;
        font-size:9px;
    }

    .pitch-center-circle{
        width:90px;
        height:90px;
    }

    .pitch-penalty-dot.top{
        top:14%;
    }

    .pitch-penalty-dot.bottom{
        bottom:14%;
    }

    .players-grid{
        grid-template-columns:1fr;
    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media(max-width:400px){

    .pitch-player{
        width:55px;
    }

    .pitch-player img{
        width:40px;
        height:40px;
    }

    .pitch-player-name{
        font-size:8px;
    }

    .pitch-position{
        font-size:8px;
    }

}

</style>

</head>


<body>


<header>

    <h1>⚽ دوري الابن الزيدوني</h1>

</header>


<div class="container">


<!-- =====================================================
     MATCH INFO
===================================================== -->

<div
    id="matchInfo"
    class="card"
>

    جاري تحميل المباراة...

</div>


<!-- =====================================================
     EXPECTED LINEUP
===================================================== -->

<div
    id="expectedSection"
    class="card"
    style="display:none;"
>

    <h2 class="pitch-title">
        🎯 التشكيلة المتوقعة
    </h2>

    <p class="pitch-subtitle">
        الخطة التي تم إعدادها قبل بداية المباراة
    </p>


    <div class="pitch-wrapper">

        <div
            id="expectedPitch"
            class="pitch"
        >

            <div class="pitch-midline"></div>

            <div class="pitch-center-circle"></div>

            <div class="pitch-center-dot"></div>

            <div class="pitch-penalty-dot top"></div>

            <div class="pitch-penalty-dot bottom"></div>

            <div class="pitch-penalty top"></div>

            <div class="pitch-penalty bottom"></div>

            <div class="pitch-goal-area top"></div>

            <div class="pitch-goal-area bottom"></div>

            <div class="pitch-goal top"></div>

            <div class="pitch-goal bottom"></div>

            <div
                id="expectedPlayers"
            ></div>

        </div>

    </div>

</div>


<!-- =====================================================
     ACTUAL LINEUP
===================================================== -->

<div
    id="actualSection"
    class="card"
    style="display:none;"
>

    <h2 class="pitch-title">
        ⚽ تشكيلة المباراة
    </h2>

    <p class="pitch-subtitle">
        التشكيلة التي لعبت المباراة فعليًا
    </p>


    <div class="pitch-wrapper">

        <div
            id="actualPitch"
            class="pitch"
        >

            <div class="pitch-midline"></div>

            <div class="pitch-center-circle"></div>

            <div class="pitch-center-dot"></div>

            <div class="pitch-penalty-dot top"></div>

            <div class="pitch-penalty-dot bottom"></div>

            <div class="pitch-penalty top"></div>

            <div class="pitch-penalty bottom"></div>

            <div class="pitch-goal-area top"></div>

            <div class="pitch-goal-area bottom"></div>

            <div class="pitch-goal top"></div>

            <div class="pitch-goal bottom"></div>

            <div
                id="actualPlayers"
            ></div>

        </div>

    </div>

</div>


<!-- =====================================================
     PLAYER RATINGS
===================================================== -->

<div
    id="ratingsSection"
    class="card"
    style="display:none;"
>

    <h2>
        ⭐ تقييمات اللاعبين
    </h2>

    <div
        id="ratings"
        class="players-grid"
    ></div>

</div>


</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://dtxexuaverridpntgwkj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7lxTHAsOFz2Ljsq6pb4Mw_9a2xutP3";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GET MATCH ID
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);

const matchId =
params.get("id");


/* =====================================================
   LOAD MATCH
===================================================== */

async function loadMatch(){

    if(!matchId){

        document.getElementById(
            "matchInfo"
        ).innerHTML = `

            <h2>
                ❌ لم يتم تحديد المباراة
            </h2>

        `;

        return;
    }


    const {data:match,error} =
        await supabaseClient
        .from("matches")
        .select("*")
        .eq("id",matchId)
        .single();


    if(error || !match){

        console.error(error);

        document.getElementById(
            "matchInfo"
        ).innerHTML = `

            <h2>
                ❌ المباراة غير موجودة
            </h2>

        `;

        return;
    }


    await renderMatch(match);

}


/* =====================================================
   RENDER MATCH
===================================================== */

async function renderMatch(match){

    const {data:teams,error:teamsError} =
        await supabaseClient
        .from("teams")
        .select("*");


    if(teamsError){
        console.error(teamsError);
    }


    const homeTeam =
        teams?.find(
            team =>
            team.name === match.home
        );


    const awayTeam =
        teams?.find(
            team =>
            team.name === match.away
        );


    const homeLogo =
        homeTeam?.logo || "";


    const awayLogo =
        awayTeam?.logo || "";


    const played =
        match.played === true;


    const homeGoals =
        Number(match.home_goals) || 0;


    const awayGoals =
        Number(match.away_goals) || 0;


    document.getElementById(
        "matchInfo"
    ).innerHTML = `

        <div class="match-header">

            ${
                match.round
                ? `

                    <div class="match-round">
                        الجولة ${escapeHtml(match.round)}
                    </div>

                  `
                : ""
            }


            <div class="teams">


                <!-- HOME -->

                <div class="team">

                    ${
                        homeLogo
                        ? `

                            <img
                                class="team-logo"
                                src="${homeLogo}"
                                alt="${escapeHtml(match.home)}"
                            >

                          `
                        : `

                            <div
                                class="team-logo"
                                style="
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    font-size:50px;
                                "
                            >
                                ⚽
                            </div>

                          `
                    }


                    <div class="team-name">
                        ${escapeHtml(match.home)}
                    </div>

                </div>


                <!-- SCORE -->

                <div>

                    ${
                        played

                        ? `

                            <div class="score">
                                ${homeGoals}
                                -
                                ${awayGoals}
                            </div>

                          `

                        : `

                            <div class="vs">
                                VS
                            </div>

                          `
                    }

                </div>


                <!-- AWAY -->

                <div class="team">

                    ${
                        awayLogo
                        ? `

                            <img
                                class="team-logo"
                                src="${awayLogo}"
                                alt="${escapeHtml(match.away)}"
                            >

                          `
                        : `

                            <div
                                class="team-logo"
                                style="
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    font-size:50px;
                                "
                            >
                                ⚽
                            </div>

                          `
                    }


                    <div class="team-name">
                        ${escapeHtml(match.away)}
                    </div>

                </div>

            </div>


            ${
                played

                ? `

                    <div class="finished">
                        ✅ انتهت المباراة
                    </div>

                  `

                : `

                    <div class="not-started">
                        ⏳ لم تبدأ المباراة بعد
                    </div>

                  `
            }


            ${
                match.match_date ||
                match.match_time

                ? `

                    <div class="match-date">

                        ${
                            match.match_date
                            ? "📅 " +
                              formatDate(match.match_date)
                            : ""
                        }

                        ${
                            match.match_time
                            ? " &nbsp; 🕐 " +
                              formatTime(match.match_time)
                            : ""
                        }

                    </div>

                  `
                : ""
            }

        </div>

    `;


    /*
       التشكيلة المتوقعة
       تظهر لجميع المستخدمين
    */

    await loadExpectedLineup(match);


    /*
       التشكيلة الفعلية
    */

    await loadActualLineup(match);

}


/* =====================================================
   EXPECTED LINEUP
===================================================== */

async function loadExpectedLineup(match){

    const {data,error} =
        await supabaseClient
        .from("expected_lineups")
        .select("*")
        .eq(
            "match_id",
            match.id
        );


    if(error){

        console.error(
            "Expected lineup error:",
            error
        );

        return;
    }


    /*
       لا توجد تشكيلة متوقعة
    */

    if(!data || !data.length)
        return;


    /*
       إظهار الملعب
    */

    document.getElementById(
        "expectedSection"
    ).style.display =
        "block";


    /*
       IDs اللاعبين
    */

    const playerIds =
        data.map(
            row =>
            row.player_id
        );


    /*
       جلب اللاعبين
    */

    const {data:players,error:playersError} =
        await supabaseClient
        .from("players")
        .select("*")
        .in(
            "id",
            playerIds
        );


    if(playersError){

        console.error(
            "Players error:",
            playersError
        );

        return;
    }


    if(!players)
        return;


    const container =
        document.getElementById(
            "expectedPlayers"
        );


    /*
       ترتيب اللاعبين حسب موقعهم
    */

    const sortedData =
        [...data].sort(
            (a,b) =>
                Number(a.y || 50) -
                Number(b.y || 50)
        );


    container.innerHTML =
        sortedData.map(
            row => {

                const player =
                    players.find(
                        p =>
                        String(p.id) ===
                        String(row.player_id)
                    );


                if(!player)
                    return "";


                return createPitchPlayer(
                    player,
                    row,
                    false
                );

            }
        ).join("");


    /*
       أسماء الفريقين داخل الملعب
    */

    const homePlayers =
        sortedData.filter(
            row =>
            row.team === match.home
        );


    const awayPlayers =
        sortedData.filter(
            row =>
            row.team === match.away
        );


    /*
       نضيف أسماء الفريقين
       فقط إذا كان هناك لاعبين
    */

    if(homePlayers.length){

        container.insertAdjacentHTML(
            "beforeend",
            `
                <div class="pitch-team-label top">
                    ${escapeHtml(match.home)}
                </div>
            `
        );

    }


    if(awayPlayers.length){

        container.insertAdjacentHTML(
            "beforeend",
            `
                <div class="pitch-team-label bottom">
                    ${escapeHtml(match.away)}
                </div>
            `
        );

    }

}


/* =====================================================
   ACTUAL LINEUP
===================================================== */

async function loadActualLineup(match){

    const {data,error} =
        await supabaseClient
        .from("match_players")
        .select("*")
        .eq(
            "match_id",
            match.id
        );


    if(error){

        console.error(
            "Actual lineup error:",
            error
        );

        return;
    }


    if(!data || !data.length)
        return;


    document.getElementById(
        "actualSection"
    ).style.display =
        "block";


    const playerIds =
        data.map(
            row =>
            row.player_id
        );


    const {data:players,error:playersError} =
        await supabaseClient
        .from("players")
        .select("*")
        .in(
            "id",
            playerIds
        );


    if(playersError){

        console.error(playersError);

        return;
    }


    if(!players)
        return;


    const container =
        document.getElementById(
            "actualPlayers"
        );


    container.innerHTML =
        data.map(
            row => {

                const player =
                    players.find(
                        p =>
                        String(p.id) ===
                        String(row.player_id)
                    );


                if(!player)
                    return "";


                return createPitchPlayer(
                    player,
                    row,
                    true
                );

            }
        ).join("");


    renderRatings(
        data,
        players
    );

}


/* =====================================================
   CREATE PLAYER
===================================================== */

function createPitchPlayer(
    player,
    row,
    actual
){

    const x =
        Math.max(
            4,
            Math.min(
                96,
                Number(row.x) || 50
            )
        );


    const y =
        Math.max(
            4,
            Math.min(
                96,
                Number(row.y) || 50
            )
        );


    const photo =
        player.photo || "";


    const positionIcons = {

        GK:"🧤",

        DEF:"🛡️",

        MID:"⚙️",

        ATT:"⚡",

        CB:"🛡️",

        LB:"🛡️",

        RB:"🛡️",

        CDM:"⚙️",

        CM:"⚙️",

        AMF:"🎯",

        LW:"⚡",

        RW:"⚡",

        ST:"⚡"

    };


    const icon =
        positionIcons[
            String(row.position || "").toUpperCase()
        ] || "⚽";


    /*
       Goals
    */

    const goalIcon =
        actual &&
        Number(row.goals) > 0

        ? ` ⚽ ${Number(row.goals)}`

        : "";


    /*
       Assists
    */

    const assistIcon =
        actual &&
        Number(row.assists) > 0

        ? ` 👟 ${Number(row.assists)}`

        : "";


    return `

        <div
            class="pitch-player"
            style="
                left:${x}%;
                top:${y}%;
            "
        >


            ${
                player.number
                ? `

                    <div class="pitch-player-number">
                        ${escapeHtml(player.number)}
                    </div>

                  `
                : ""
            }


            ${
                photo

                ? `

                    <img
                        src="${photo}"
                        alt="${escapeHtml(player.name)}"
                        loading="lazy"
                    >

                  `

                : `

                    <div
                        style="
                            width:62px;
                            height:62px;
                            border-radius:50%;
                            border:3px solid white;
                            background:#e5e7eb;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:25px;
                            box-shadow:0 5px 14px rgba(0,0,0,.45);
                        "
                    >
                        👤
                    </div>

                  `
            }


            <div class="pitch-player-name">

                ${escapeHtml(player.name)}

                ${goalIcon}

                ${assistIcon}

            </div>


            <div class="pitch-position">

                ${icon}

                ${escapeHtml(row.position || "")}

            </div>


        </div>

    `;

}


/* =====================================================
   RATINGS
===================================================== */

function renderRatings(
    rows,
    players
){

    const section =
        document.getElementById(
            "ratingsSection"
        );


    const container =
        document.getElementById(
            "ratings"
        );


    section.style.display =
        "block";


    const sorted =
        [...rows].sort(
            (a,b) =>
            Number(b.rating || 0) -
            Number(a.rating || 0)
        );


    container.innerHTML =
        sorted
        .map(
            row => {

                const player =
                    players.find(
                        p =>
                        String(p.id) ===
                        String(row.player_id)
                    );


                if(!player)
                    return "";


                const photo =
                    player.photo || "";


                return `

                    <div class="player-card">


                        ${
                            photo

                            ? `

                                <img
                                    src="${photo}"
                                    alt="${escapeHtml(player.name)}"
                                    loading="lazy"
                                >

                              `

                            : `

                                <div
                                    style="
                                        width:60px;
                                        height:60px;
                                        border-radius:50%;
                                        background:#e5e7eb;
                                        display:flex;
                                        align-items:center;
                                        justify-content:center;
                                        font-size:25px;
                                    "
                                >
                                    👤
                                </div>

                              `
                        }


                        <div class="player-info">


                            <div class="player-name">

                                ${escapeHtml(player.name)}

                            </div>


                            <div class="player-stat">

                                ⭐ التقييم:

                                <strong>
                                    ${Number(row.rating || 0).toFixed(1)}
                                </strong>

                            </div>


                            <div class="badges">


                                ${
                                    Number(row.goals) > 0

                                    ? `

                                        <span class="goal-badge">
                                            ⚽ ${Number(row.goals)} هدف
                                        </span>

                                      `

                                    : ""
                                }


                                ${
                                    Number(row.assists) > 0

                                    ? `

                                        <span class="assist-badge">
                                            👟 ${Number(row.assists)} أسيست
                                        </span>

                                      `

                                    : ""
                                }


                            </div>


                        </div>


                    </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   DATE
===================================================== */

function formatDate(date){

    if(!date)
        return "";


    const parts =
        String(date).split("-");


    if(parts.length !== 3)
        return escapeHtml(date);


    return `${parts[2]}/${parts[1]}/${parts[0]}`;

}


/* =====================================================
   TIME
===================================================== */

function formatTime(time){

    if(!time)
        return "";


    return String(time).slice(0,5);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
