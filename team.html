<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الفريق | دوري الابن الزيدوني</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#071b12;
    color:white;
}

/* =========================
   HEADER
========================= */

header{
    background:linear-gradient(135deg,#0b1220,#172033);
    padding:18px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

header h1{
    margin:0;
    font-size:28px;
}

/* =========================
   CONTAINER
========================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 15px;
}

/* =========================
   TEAM HEADER
========================= */

.team-header{
    background:linear-gradient(
        135deg,
        #111827,
        #1f2937
    );

    border-radius:20px;
    padding:25px;
    text-align:center;
    margin-bottom:25px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.4);
}

.team-logo{
    width:120px;
    height:120px;
    object-fit:contain;
}

.team-name{
    font-size:34px;
    font-weight:bold;
    margin-top:10px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    margin-top:25px;
}

.stat{
    background:#0b1220;
    border-radius:12px;
    padding:12px 5px;
}

.stat span{
    display:block;
    color:#9ca3af;
    font-size:13px;
    margin-bottom:5px;
}

.stat strong{
    font-size:22px;
}

/* =========================
   PITCH SECTION
========================= */

.pitch-section{
    margin-top:25px;
}

.pitch-title{
    text-align:center;
    font-size:25px;
    margin-bottom:15px;
}

/* =========================
   FOOTBALL PITCH
========================= */

.pitch{

    position:relative;

    width:100%;
    max-width:900px;

    aspect-ratio:16 / 10;

    margin:auto;

    overflow:hidden;

    border-radius:20px;

    background:
        repeating-linear-gradient(
            90deg,
            #16823b 0,
            #16823b 12.5%,
            #1b9144 12.5%,
            #1b9144 25%
        );

    border:5px solid white;

    box-shadow:
        0 15px 40px rgba(0,0,0,.45);

}

/* middle line */

.pitch::before{

    content:"";

    position:absolute;

    top:0;
    bottom:0;

    left:50%;

    width:3px;

    background:white;

    transform:translateX(-50%);

}

/* center circle */

.pitch::after{

    content:"";

    position:absolute;

    width:150px;
    height:150px;

    border:3px solid white;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

}

/* =========================
   PENALTY AREAS
========================= */

.penalty-left,
.penalty-right{

    position:absolute;

    top:27%;

    width:14%;

    height:46%;

    border:3px solid white;

}

.penalty-left{
    left:0;
    border-left:0;
}

.penalty-right{
    right:0;
    border-right:0;
}

/* goal areas */

.goal-left,
.goal-right{

    position:absolute;

    top:38%;

    width:6%;

    height:24%;

    border:3px solid white;

}

.goal-left{
    left:0;
    border-left:0;
}

.goal-right{
    right:0;
    border-right:0;
}

/* =========================
   PLAYER
========================= */

.player-card{

    position:absolute;

    transform:translate(-50%,-50%);

    text-decoration:none;

    color:white;

    text-align:center;

    width:100px;

    z-index:5;

    transition:.2s;

}

.player-card:hover{

    transform:
        translate(-50%,-50%)
        scale(1.12);

    z-index:20;

}

/* player image */

.player-photo{

    width:58px;
    height:58px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid white;

    background:#111827;

    box-shadow:
        0 4px 12px rgba(0,0,0,.5);

}

/* player info */

.player-info{

    margin-top:4px;

    background:
        rgba(0,0,0,.75);

    border-radius:8px;

    padding:4px 6px;

}

.player-name{

    font-size:12px;
    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;

}

.player-number{

    font-size:11px;
    color:#d1d5db;

}

/* =========================
   POSITION COLORS
========================= */

.position{

    font-size:9px;

    color:#86efac;

}

/* =========================
   PLAYERS LIST
========================= */

.section{

    background:white;
    color:#172033;

    margin-top:25px;

    padding:25px;

    border-radius:20px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);

}

.section h2{
    margin-top:0;
}

/* =========================
   MATCHES
========================= */

.match{

    display:grid;

    grid-template-columns:
        1fr 100px 1fr;

    align-items:center;

    text-align:center;

    padding:15px;

    margin-bottom:10px;

    background:#f3f4f6;

    border-radius:12px;

    color:#172033;

}

.score{

    font-size:23px;
    font-weight:bold;

}

.win{
    border-right:5px solid #16a34a;
}

.draw{
    border-right:5px solid #eab308;
}

.loss{
    border-right:5px solid #dc2626;
}

/* =========================
   BACK
========================= */

.back{

    display:block;

    width:max-content;

    margin:25px auto;

    padding:13px 28px;

    background:#16a34a;

    color:white;

    text-decoration:none;

    border-radius:10px;

    font-weight:bold;

}

/* =========================
   LOADING
========================= */

.loading{

    text-align:center;

    font-size:22px;

    padding:60px;

}

/* =========================
   ERROR
========================= */

.error{

    background:white;

    color:#dc2626;

    text-align:center;

    padding:40px;

    border-radius:20px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .container{
        padding:10px;
    }

    .team-name{
        font-size:25px;
    }

    .team-logo{
        width:90px;
        height:90px;
    }

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .pitch{

        aspect-ratio:10 / 15;

        max-width:500px;

    }

    .pitch::before{

        top:50%;
        bottom:auto;

        left:0;
        right:0;

        width:auto;
        height:3px;

        transform:translateY(-50%);

    }

    .pitch::after{

        width:110px;
        height:110px;

    }

    .penalty-left,
    .penalty-right{

        top:0;

        left:27%;
        right:auto;

        width:46%;
        height:14%;

    }

    .penalty-right{

        top:auto;
        bottom:0;

    }

    .goal-left,
    .goal-right{

        left:38%;

        width:24%;
        height:6%;

    }

    .goal-right{

        top:auto;
        bottom:0;

    }

    .player-card{
        width:75px;
    }

    .player-photo{

        width:48px;
        height:48px;

    }

    .player-name{

        font-size:10px;

    }

    .player-number{

        font-size:9px;

    }

    .match{

        grid-template-columns:
            1fr 70px 1fr;

        font-size:13px;

    }

}

/* =========================
   EMPTY PLAYERS
========================= */

.empty{

    text-align:center;

    padding:30px;

    color:#9ca3af;

}

</style>

</head>

<body>

<header>

    <h1>
        🏆 دوري الابن الزيدوني
    </h1>

</header>


<div class="container">

    <div
        id="loading"
        class="loading"
    >
        جاري تحميل بيانات الفريق...
    </div>

    <div
        id="content"
        style="display:none;"
    ></div>

</div>


<script>

/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =
"https://dtxexuaverridpntgwkj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7lxTHAsOFz2L2jsq6pb4Mw_9a2xutP3";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================================
   LOAD TEAM
================================================= */

async function loadTeam(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const teamName =
        params.get("team");


    if(!teamName){

        showError(
            "لم يتم تحديد الفريق."
        );

        return;

    }


    const [
        teamResult,
        playersResult,
        matchesResult
    ] = await Promise.all([


        supabaseClient
            .from("teams")
            .select("*")
            .eq("name",teamName)
            .single(),


        supabaseClient
            .from("players")
            .select("*")
            .eq("team",teamName)
            .order(
                "number",
                {
                    ascending:true
                }
            ),


        supabaseClient
            .from("matches")
            .select("*")
            .or(
                `home.eq.${teamName},away.eq.${teamName}`
            )
            .order(
                "match_date",
                {
                    ascending:false
                }
            )

    ]);


    if(teamResult.error){

        console.error(
            teamResult.error
        );

        showError(
            "لم يتم العثور على الفريق."
        );

        return;

    }


    if(playersResult.error){

        console.error(
            playersResult.error
        );

        showError(
            "حدث خطأ في تحميل اللاعبين."
        );

        return;

    }


    if(matchesResult.error){

        console.error(
            matchesResult.error
        );

        showError(
            "حدث خطأ في تحميل المباريات."
        );

        return;

    }


    const team =
        teamResult.data;

    const players =
        playersResult.data || [];

    const matches =
        matchesResult.data || [];


    calculateStats(
        teamName,
        matches
    );


    renderTeam(
        team,
        players,
        matches,
        teamName
    );

}


/* =================================================
   CALCULATE STATS
================================================= */

function calculateStats(
    teamName,
    matches
){

    let played = 0;
    let wins = 0;
    let draws = 0;
    let losses = 0;
    let gf = 0;
    let ga = 0;


    matches.forEach(match => {

        const homeGoals =
            Number(
                match.home_goals || 0
            );

        const awayGoals =
            Number(
                match.away_goals || 0
            );


        played++;


        if(match.home === teamName){

            gf += homeGoals;
            ga += awayGoals;


            if(homeGoals > awayGoals){

                wins++;

            }

            else if(
                homeGoals === awayGoals
            ){

                draws++;

            }

            else{

                losses++;

            }

        }

        else{

            gf += awayGoals;
            ga += homeGoals;


            if(awayGoals > homeGoals){

                wins++;

            }

            else if(
                awayGoals === homeGoals
            ){

                draws++;

            }

            else{

                losses++;

            }

        }

    });


    window.teamStats = {

        played,

        wins,

        draws,

        losses,

        gf,

        ga,

        gd:gf-ga,

        points:
            wins * 3 + draws

    };

}


/* =================================================
   POSITION
================================================= */

function getPositionClass(position){

    if(!position)
        return "unknown";

    const p =
        position
            .toLowerCase()
            .trim();


    if(
        p.includes("gk") ||
        p.includes("goal") ||
        p.includes("حارس")
    )
        return "gk";


    if(
        p.includes("cb") ||
        p.includes("def") ||
        p.includes("دفاع") ||
        p.includes("ظهير")
    )
        return "def";


    if(
        p.includes("mid") ||
        p.includes("cm") ||
        p.includes("dm") ||
        p.includes("am") ||
        p.includes("وسط")
    )
        return "mid";


    if(
        p.includes("fw") ||
        p.includes("st") ||
        p.includes("cf") ||
        p.includes("lw") ||
        p.includes("rw") ||
        p.includes("att") ||
        p.includes("مهاجم")
    )
        return "att";


    return "unknown";

}


/* =================================================
   CREATE PLAYER POSITION
================================================= */

function getPlayerCoordinates(
    player,
    index,
    total
){

    const type =
        getPositionClass(
            player.position
        );


    let positions = [];


    /* GOALKEEPER */

    if(type === "gk"){

        positions = [
            [50,92]
        ];

    }


    /* DEFENDERS */

    else if(type === "def"){

        positions = [

            [20,75],
            [40,80],
            [60,80],
            [80,75]

        ];

    }


    /* MIDFIELDERS */

    else if(type === "mid"){

        positions = [

            [20,53],
            [40,58],
            [60,58],
            [80,53]

        ];

    }


    /* ATTACKERS */

    else if(type === "att"){

        positions = [

            [25,27],
            [50,22],
            [75,27]

        ];

    }


    /* UNKNOWN */

    else{

        positions = [

            [15,15],
            [35,15],
            [55,15],
            [75,15]

        ];

    }


    const position =
        positions[
            index % positions.length
        ];


    return {

        left:position[0],
        top:position[1]

    };

}


/* =================================================
   RENDER TEAM
================================================= */

function renderTeam(
    team,
    players,
    matches,
    teamName
){

    document.title =
        teamName +
        " | دوري الابن الزيدوني";


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    const content =
        document.getElementById(
            "content"
        );


    content.style.display =
        "block";


    const stats =
        window.teamStats;


    const logo =
        team.logo ||
        "https://via.placeholder.com/150?text=TEAM";


    /* GROUP PLAYERS */

    const groups = {

        gk:[],
        def:[],
        mid:[],
        att:[],
        unknown:[]

    };


    players.forEach(
        player => {

            const type =
                getPositionClass(
                    player.position
                );

            groups[type].push(
                player
            );

        }
    );


    /* CREATE PLAYERS */

    let playersHTML = "";


    Object.keys(groups)
        .forEach(
            type => {

                groups[type]
                    .forEach(
                        (player,index) => {

                            const coords =
                                getPlayerCoordinates(
                                    player,
                                    index,
                                    groups[type].length
                                );


                            const photo =
                                player.photo ||
                                "https://via.placeholder.com/100?text=PLAYER";


                            playersHTML += `

                                <a
                                    class="player-card"
                                    href="player.html?id=${encodeURIComponent(player.id)}"
                                    style="
                                        left:${coords.left}%;
                                        top:${coords.top}%;
                                    "
                                >

                                    <img
                                        class="player-photo"
                                        src="${escapeHtml(photo)}"
                                        alt="${escapeHtml(player.name)}"
                                    >

                                    <div class="player-info">

                                        <div class="player-name">

                                            ${escapeHtml(
                                                player.name
                                            )}

                                        </div>

                                        <div class="player-number">

                                            #${player.number ?? "-"}

                                        </div>

                                    </div>

                                </a>

                            `;

                        }
                    );

            }
        );


    content.innerHTML = `

        <!-- TEAM -->

        <div class="team-header">

            <img
                class="team-logo"
                src="${escapeHtml(logo)}"
                alt="${escapeHtml(teamName)}"
            >

            <div class="team-name">

                ${escapeHtml(teamName)}

            </div>


            <div class="stats">

                <div class="stat">
                    <span>لعب</span>
                    <strong>${stats.played}</strong>
                </div>

                <div class="stat">
                    <span>فوز</span>
                    <strong>${stats.wins}</strong>
                </div>

                <div class="stat">
                    <span>تعادل</span>
                    <strong>${stats.draws}</strong>
                </div>

                <div class="stat">
                    <span>خسارة</span>
                    <strong>${stats.losses}</strong>
                </div>

                <div class="stat">
                    <span>له</span>
                    <strong>${stats.gf}</strong>
                </div>

                <div class="stat">
                    <span>عليه</span>
                    <strong>${stats.ga}</strong>
                </div>

                <div class="stat">
                    <span>النقاط</span>
                    <strong>${stats.points}</strong>
                </div>

            </div>

        </div>


        <!-- PITCH -->

        <div class="pitch-section">

            <div class="pitch-title">

                🏟️ تشكيلة ${escapeHtml(teamName)}

            </div>


            <div class="pitch">

                <div class="penalty-left"></div>

                <div class="penalty-right"></div>

                <div class="goal-left"></div>

                <div class="goal-right"></div>


                ${

                    players.length

                    ?

                    playersHTML

                    :

                    `

                        <div
                            style="
                                position:absolute;
                                top:50%;
                                left:50%;
                                transform:translate(-50%,-50%);
                                background:rgba(0,0,0,.7);
                                padding:20px;
                                border-radius:15px;
                                z-index:10;
                                text-align:center;
                            "
                        >

                            لا يوجد لاعبين في الفريق

                        </div>

                    `

                }

            </div>

        </div>


        <!-- MATCHES -->

        <div class="section">

            <h2>
                ⚽ مباريات الفريق
            </h2>


            ${

                matches.length

                ?

                matches.map(
                    match => {

                        const homeGoals =
                            Number(
                                match.home_goals || 0
                            );

                        const awayGoals =
                            Number(
                                match.away_goals || 0
                            );


                        const teamIsHome =
                            match.home === teamName;


                        const teamGoals =
                            teamIsHome
                            ? homeGoals
                            : awayGoals;


                        const opponentGoals =
                            teamIsHome
                            ? awayGoals
                            : homeGoals;


                        let resultClass =
                            "";


                        if(
                            teamGoals >
                            opponentGoals
                        ){

                            resultClass =
                                "win";

                        }

                        else if(
                            teamGoals ===
                            opponentGoals
                        ){

                            resultClass =
                                "draw";

                        }

                        else{

                            resultClass =
                                "loss";

                        }


                        return `

                            <div
                                class="match ${resultClass}"
                            >

                                <div>
                                    ${escapeHtml(
                                        match.home
                                    )}
                                </div>

                                <div class="score">

                                    ${homeGoals}
                                    -
                                    ${awayGoals}

                                </div>

                                <div>
                                    ${escapeHtml(
                                        match.away
                                    )}
                                </div>

                            </div>

                        `;

                    }
                ).join("")


                :

                "<p>لا توجد مباريات حتى الآن.</p>"

            }

        </div>


        <a
            class="back"
            href="index.html"
        >

            ← العودة إلى الدوري

        </a>

    `;

}


/* =================================================
   ERROR
================================================= */

function showError(message){

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    const content =
        document.getElementById(
            "content"
        );


    content.style.display =
        "block";


    content.innerHTML = `

        <div class="error">

            ${escapeHtml(message)}

            <br><br>

            <a
                class="back"
                href="index.html"
            >

                ← العودة إلى الدوري

            </a>

        </div>

    `;

}


/* =================================================
   ESCAPE HTML
================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =================================================
   START
================================================= */

loadTeam();

</script>

</body>
</html>
